<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiêu dùng thông minh</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="./css/TongQuan.css" type="text/css" />
    <link rel="stylesheet" href="./css/user.css" type="text/css" />
</head>

<body>
    
    <div class="container py-4">
        
      
        <a href="index.html" class="btn-back text-decoration-none">
            <i class="bi bi-arrow-left"></i> Quay lại Tổng quan
        </a>

       
        <div class="content my-4">
          
            <div class="row g-4">
                
                
                <div class="col-12 col-lg-8">
                    <div class="bg-white p-4 rounded-4 shadow-sm border border-light-subtle h-100">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 class="fs-5 fw-semibold text-dark m-0">
                            
                            </h3>
                            <select class="form-select form-select-sm bg-light w-auto text-secondary" style="font-size: 0.75rem;">
                                <option>12 tháng</option>
                                <option>6 tháng</option>
                            </select>
                        </div>
                        
                        <div style="height: 280px; position: relative;">
                            <canvas id="spendingCanvas"></canvas>
                        </div>
                    </div>
                </div>

               
                <div class="col-12 col-lg-4">
                    <div class="bg-white p-4 rounded-4 shadow-sm border border-light-subtle d-flex flex-col flex-column justify-content-between h-100">
                        <h3 class="fs-5 fw-semibold text-dark mb-3 m-0">
                            Chi tiêu theo danh mục
                        </h3>

                        <div class="row g-3 align-items-center">
                           
                            <div class="col-12 position-relative d-flex align-items-center justify-content-center" style="height: 180px;">
                                <canvas id="categoryCanvas"></canvas>
                                <div class="position-absolute top-50 start-50 translate-middle text-center pointer-events-none" style="user-select: none;">
                                    <span id="totalCategoryExpenseText" class="d-block fs-6 fw-bold text-dark">0 đ</span>
<span id="totalCategorySubText" class="d-block small text-muted text-nowrap" style="font-size: 0.7rem;">Tổng giao dịch</span>
                                </div>
                            </div>

                          
                            <div class="col-12">
                                <div id="categoryLegendList" class="small text-muted space-y-1">
                                 
                                </div>
                            </div>
                        </div>

                        <a href="#" class="d-block text-center text-primary small fw-medium text-decoration-none hover:underline mt-4">
                            Xem chi tiết báo cáo
                        </a>
                    </div>
                </div>

            </div> 
        </div> 
    </div> 

    
    <footer class="bg-white border-t border-top border-light-subtle mt-5 py-4 text-center text-secondary small">
        <p class="mb-1">© 2026 Tiêu dùng thông minh. All rights reserved.</p>
        <p class="mb-0">Quản lý chi tiêu hiệu quả mỗi ngày.</p>
    </footer>


    <script src="./javascript/spending-chart.js"></script>
    <script src="./javascript/category-chart.js"></script>
    <script src="./javascript/tong.js"></script>
    <script src="./javascript/baocao.js"></script>
</body>

</html>
